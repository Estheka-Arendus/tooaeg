<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tööaeg</title>
<meta name="description" content="Objektipõhine tööaja arvestus: start, paus, lõpp ja kuu koondvaade.">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tööaeg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #f4f5f4;
  --surface: #ffffff;
  --surface-2: #eef1f0;
  --text: #17201e;
  --muted: #5d6b67;
  --border: #dde3e1;
  --accent: #0f766e;
  --accent-text: #ffffff;
  --pause: #b45309;
  --pause-bg: #fdf3e3;
  --danger: #b42318;
  --danger-bg: #fdecea;
  --ok-bg: #e3f4f1;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1312;
    --surface: #171e1c;
    --surface-2: #1f2826;
    --text: #e8eeec;
    --muted: #93a29e;
    --border: #2a3533;
    --accent: #2bb5a6;
    --accent-text: #04201d;
    --pause: #f0a54a;
    --pause-bg: #2e2312;
    --danger: #f2776b;
    --danger-bg: #351816;
    --ok-bg: #12302c;
    --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  min-height: 100dvh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

header.top {
  position: sticky; top: 0; z-index: 5;
  padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
  background: var(--bg);
}
header.top h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
main { padding: 4px 16px calc(96px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
section[hidden] { display: none; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; margin: 18px 4px 8px; }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.spacer { flex: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--border); background: var(--surface); border-radius: 12px;
  padding: 10px 14px; min-height: 44px; font-weight: 600;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.pause { background: var(--pause-bg); border-color: transparent; color: var(--pause); }
.btn.danger { background: var(--danger-bg); border-color: transparent; color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 8px 10px; }
.btn.big { width: 100%; min-height: 64px; font-size: 20px; border-radius: 16px; }
.btn.small { min-height: 36px; padding: 6px 10px; font-size: 14px; }

/* object picker */
.objlist { display: grid; gap: 8px; }
.obj {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface);
  font-weight: 600; min-height: 54px;
}
.obj .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex: none; }
.obj[aria-pressed="true"] { border-color: var(--accent); background: var(--ok-bg); }
.obj[aria-pressed="true"] .dot { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 45%, transparent 50%); }

/* running timer */
.timer { text-align: center; padding: 22px 16px; }
.timer .objname { font-size: 20px; font-weight: 700; margin: 8px 0 2px; overflow-wrap: anywhere; }
.pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.pill.work { background: var(--ok-bg); color: var(--accent); }
.pill.paused { background: var(--pause-bg); color: var(--pause); }
.clock { font-size: 56px; font-weight: 700; letter-spacing: -.02em; margin: 10px 0 4px; line-height: 1.1; }
.clock.paused { color: var(--muted); font-size: 40px; }
.pauseclock { margin: 6px auto 10px; padding: 10px 16px; border-radius: 14px; background: var(--pause-bg); color: var(--pause); display: inline-block; }
.pauseclock .k { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.pauseclock .v { font-size: 40px; font-weight: 700; line-height: 1.1; }
.timer .meta { color: var(--muted); font-size: 15px; }
.timer .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 10px; box-shadow: var(--shadow); }
.stat .v { font-size: 22px; font-weight: 700; }
.stat .k { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* month nav */
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.monthnav .title { font-size: 18px; font-weight: 700; text-transform: capitalize; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 20px; line-height: 1; }

/* day + sessions */
.day { padding: 0; overflow: hidden; }
.dayhead { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; background: var(--surface-2); }
.dayhead .d { font-weight: 700; }
.dayhead .t { margin-left: auto; text-align: right; }
.dayhead .t b { font-size: 17px; }
.dayhead .t span { display: block; font-size: 13px; color: var(--muted); }
.sess { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--border); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.sess .o { font-weight: 600; overflow-wrap: anywhere; }
.sess .s { font-size: 14px; color: var(--muted); }
.sess .note { font-size: 14px; margin-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
textarea { min-height: 96px; resize: vertical; line-height: 1.4; }
.sess .h { margin-left: auto; font-weight: 700; white-space: nowrap; }
.sess .chev { color: var(--muted); }

.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }

/* forms */
.field { display: grid; gap: 6px; margin-bottom: 12px; }
.field > span { font-size: 14px; color: var(--muted); font-weight: 600; }
input[type=text], input[type=date], input[type=time], input[type=number], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); font-size: 16px;
}
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.objrow { display: flex; align-items: center; gap: 6px; padding: 10px 0; border-top: 1px solid var(--border); }
.objrow:first-child { border-top: 0; }
.objrow .n { flex: 1; font-weight: 600; overflow-wrap: anywhere; }

/* tabs */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button { background: none; border: 0; padding: 8px 4px 10px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); min-height: 56px; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
.tabdot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); position: absolute; margin-left: 22px; margin-top: 2px; }
.tabdot.paused { background: var(--pause); }
nav.tabs button { position: relative; }

dialog {
  border: 0; border-radius: 18px; padding: 0; width: min(520px, calc(100vw - 24px));
  background: var(--surface); color: var(--text);
}
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog form { padding: 18px 16px 16px; }
dialog h2 { margin: 0 0 14px; font-size: 19px; }
.dlgactions { display: flex; gap: 8px; margin-top: 6px; }
.dlgactions .spacer { flex: 1; }

#toast {
  position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 15px;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; max-width: calc(100vw - 32px); text-align: center;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>
<header class="top"><h1 id="title">Taimer</h1></header>

<main>
  <section id="view-timer"></section>
  <section id="view-summary" hidden></section>
  <section id="view-objects" hidden></section>
</main>

<nav class="tabs" aria-label="Vaated">
  <button data-tab="timer" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
    <span id="tabdot"></span>Taimer
  </button>
  <button data-tab="summary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 13h3M7 17h3M14 13h3"/></svg>
    Koondvaade
  </button>
  <button data-tab="objects">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg>
    Objektid
  </button>
</nav>

<dialog id="dlg-session">
  <form method="dialog" id="form-session">
    <h2 id="dlg-session-title">Muuda kirjet</h2>
    <label class="field"><span>Objekt</span><select name="objectId" required></select></label>
    <label class="field"><span>Kuupäev</span><input type="date" name="date" required></label>
    <div class="grid2">
      <label class="field"><span>Algus</span><input type="time" name="start" required></label>
      <label class="field"><span>Lõpp</span><input type="time" name="end" required></label>
    </div>
    <label class="field"><span>Pausid kokku (minutit)</span><input type="number" name="pause" min="0" step="1" inputmode="numeric" value="0"></label>
    <label class="field"><span>Tehtud tööd (valikuline)</span><textarea name="note" rows="3" maxlength="1000" placeholder="nt plaatimine, vuukimine"></textarea></label>
    <p class="muted" id="dlg-session-hint" style="margin:0 0 12px;font-size:14px"></p>
    <div class="dlgactions">
      <button type="button" class="btn danger" id="dlg-session-delete">Kustuta</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="dlg-session-cancel">Tühista</button>
      <button type="submit" class="btn primary">Salvesta</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-stop">
  <form method="dialog" id="form-stop">
    <h2>Lõpeta töö</h2>
    <p id="dlg-stop-summary" class="num" style="margin:-6px 0 14px"></p>
    <label class="field"><span>Mida täna tegid? (valikuline)</span>
      <textarea name="note" rows="4" maxlength="1000" placeholder="nt plaatimine, vuukimine, materjali toomine"></textarea></label>
    <div class="dlgactions">
      <span class="spacer"></span>
      <button type="button" class="btn" id="dlg-stop-cancel">Tühista</button>
      <button type="submit" class="btn danger">Lõpeta</button>
    </div>
  </form>
</dialog>

<input type="file" id="file-import" accept="application/json,.json" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ---------- storage ---------- */
const KEY = 'tooaeg.v1';
let state = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.objects) && Array.isArray(s.sessions)) return s;
  } catch (e) {}
  return { objects: [], sessions: [], selectedObjectId: null };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('Salvestamine ebaõnnestus!'); }
}
// Ask the browser not to evict our data under storage pressure.
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- time math (everything derives from timestamps, so the
   clock stays correct while the phone is locked or the app is closed) ---------- */
const activeSession = () => state.sessions.find(s => !s.end);
const isPaused = s => s.pauses.some(p => !p.end);
const pauseMs = (s, now = Date.now()) => s.pauses.reduce((a, p) => a + ((p.end || now) - p.start), 0);
const grossMs = (s, now = Date.now()) => (s.end || now) - s.start;
const netMs = (s, now = Date.now()) => Math.max(0, grossMs(s, now) - pauseMs(s, now));

/* ---------- formatting ---------- */
const pad = n => String(n).padStart(2, '0');
function hm(ms) { const m = Math.round(ms / 60000); return Math.floor(m / 60) + ':' + pad(m % 60); }
function hms(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); }
const clockTime = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const monthKey = t => dayKey(t).slice(0, 7);
const fmtDay = key => new Date(key + 'T12:00').toLocaleDateString('et-EE', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtMonth = key => new Date(key + '-15T12:00').toLocaleDateString('et-EE', { month: 'long', year: 'numeric' });
const decH = ms => (ms / 3600000).toFixed(2).replace('.', ',');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const objName = id => { const o = state.objects.find(o => o.id === id); return o ? o.name : '(kustutatud objekt)'; };
const liveObjects = () => state.objects.filter(o => !o.archived);

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function buzz() { try { navigator.vibrate && navigator.vibrate(30); } catch (e) {} }

/* ---------- actions ---------- */
function startWork() {
  if (activeSession()) return;
  const id = state.selectedObjectId;
  if (!liveObjects().some(o => o.id === id)) { toast('Vali enne objekt'); return; }
  state.sessions.push({ id: uid(), objectId: id, start: Date.now(), end: null, pauses: [] });
  save(); buzz(); render();
}
function togglePause() {
  const s = activeSession(); if (!s) return;
  const open = s.pauses.find(p => !p.end);
  if (open) open.end = Date.now(); else s.pauses.push({ start: Date.now(), end: null });
  save(); buzz(); render();
}
function stopWork() {
  const s = activeSession(); if (!s) return;
  const f = document.getElementById('form-stop');
  f.elements.note.value = s.note || '';
  document.getElementById('dlg-stop-summary').textContent =
    objName(s.objectId) + ' · ' + clockTime(s.start) + '–' + clockTime(Date.now()) + ' · ' + hm(netMs(s)) + ' h tööd';
  document.getElementById('dlg-stop').showModal();
}
function finishWork(note) {
  const s = activeSession(); if (!s) return;
  if (note) s.note = note; else delete s.note;
  const now = Date.now();
  s.pauses.forEach(p => { if (!p.end) p.end = now; });
  s.end = now;
  save(); buzz();
  toast('Salvestatud: ' + hm(netMs(s)) + ' h tööd');
  render();
}

/* ---------- views ---------- */
let tab = 'timer';
let viewMonth = monthKey(Date.now());
let filterObject = '';

function sessionRow(s) {
  const p = pauseMs(s);
  return `<button class="sess" data-edit="${s.id}">
    <div><div class="o">${esc(objName(s.objectId))}</div>
    <div class="s num">${clockTime(s.start)}–${s.end ? clockTime(s.end) : '…'}${p >= 60000 ? ' · paus ' + hm(p) : ''}</div>${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}</div>
    <span class="h num">${hm(netMs(s))} h</span><span class="chev">›</span></button>`;
}

function renderTimer() {
  const el = document.getElementById('view-timer');
  const s = activeSession();
  const today = dayKey(Date.now());
  const todays = state.sessions.filter(x => x.end && dayKey(x.start) === today).sort((a, b) => b.start - a.start);
  let html = '';

  if (s) {
    const paused = isPaused(s);
    html += `<div class="card timer">
      <span class="pill ${paused ? 'paused' : 'work'}">${paused ? 'Pausil' : 'Töötan'}</span>
      <div class="objname">${esc(objName(s.objectId))}</div>
      <div class="clock num ${paused ? 'paused' : ''}" id="clock">${hms(netMs(s))}</div>
      ${paused ? '<div class="pauseclock"><div class="k">Paus kestnud</div><div class="v num" id="pauseclock"></div></div>' : ''}
      <div class="meta num" id="clockmeta"></div>
      <div class="actions">
        <button class="btn big ${paused ? 'primary' : 'pause'}" data-act="pause">${paused ? 'Jätka' : 'Paus'}</button>
        <button class="btn big danger" data-act="stop">Lõpeta</button>
      </div>
    </div>`;
  } else if (!liveObjects().length) {
    html += `<div class="card empty"><b>Objekte veel pole</b>Lisa esmalt objektid, mille kallal töötad.
      <div style="margin-top:14px"><button class="btn primary" data-goto="objects">Lisa objekt</button></div></div>`;
  } else {
    if (!liveObjects().some(o => o.id === state.selectedObjectId)) state.selectedObjectId = null;
    html += `<div class="label" style="margin-top:4px">Vali objekt</div><div class="objlist">` +
      liveObjects().map(o => `<button class="obj" data-pick="${o.id}" aria-pressed="${o.id === state.selectedObjectId}"><span class="dot"></span>${esc(o.name)}</button>`).join('') +
      `</div><div style="margin-top:14px"><button class="btn big primary" data-act="start" ${state.selectedObjectId ? '' : 'disabled'}>Start</button></div>`;
  }

  if (todays.length) {
    const net = todays.reduce((a, x) => a + netMs(x), 0), pz = todays.reduce((a, x) => a + pauseMs(x), 0);
    html += `<div class="label">Täna · <span class="num">${hm(net)} h</span> tööd${pz >= 60000 ? ' · <span class="num">' + hm(pz) + '</span> pausi' : ''}</div>
      <div class="card day">${todays.map(sessionRow).join('')}</div>`;
  }
  el.innerHTML = html;
  tick();
}

function tick() {
  const s = activeSession();
  const dot = document.getElementById('tabdot');
  dot.className = s ? 'tabdot' + (isPaused(s) ? ' paused' : '') : '';
  if (!s || tab !== 'timer') return;
  const c = document.getElementById('clock'), m = document.getElementById('clockmeta');
  if (!c) return;
  c.textContent = hms(netMs(s));
  const now = Date.now(), open = s.pauses.find(p => !p.end), pc = document.getElementById('pauseclock');
  if (open && pc) pc.textContent = hms(now - open.start);
  m.textContent = 'Alustasid ' + clockTime(s.start) + ' · pausid kokku ' + hm(pauseMs(s, now));
}

function renderSummary() {
  const el = document.getElementById('view-summary');
  const now = Date.now();
  const inMonth = state.sessions.filter(s => monthKey(s.start) === viewMonth && (!filterObject || s.objectId === filterObject));
  const byDay = new Map();
  inMonth.forEach(s => { const k = dayKey(s.start); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(s); });
  const days = [...byDay.keys()].sort().reverse();
  const net = inMonth.reduce((a, s) => a + netMs(s, now), 0);
  const pz = inMonth.reduce((a, s) => a + pauseMs(s, now), 0);
  const usedObjects = [...new Set(state.sessions.map(s => s.objectId))];
  const objOpts = [...new Set([...liveObjects().map(o => o.id), ...usedObjects])];

  let html = `<div class="monthnav">
      <button class="iconbtn" data-month="-1" aria-label="Eelmine kuu">‹</button>
      <span class="title">${esc(fmtMonth(viewMonth))}</span>
      <button class="iconbtn" data-month="1" aria-label="Järgmine kuu">›</button>
    </div>
    <label class="field" style="margin-bottom:12px"><select id="filter-object">
      <option value="">Kõik objektid</option>
      ${objOpts.map(id => `<option value="${id}" ${id === filterObject ? 'selected' : ''}>${esc(objName(id))}</option>`).join('')}
    </select></label>
    <div class="stats">
      <div class="stat"><div class="v num">${hm(net)}</div><div class="k">Töötunnid</div></div>
      <div class="stat"><div class="v num">${hm(pz)}</div><div class="k">Pausid</div></div>
      <div class="stat"><div class="v num">${days.length}</div><div class="k">Tööpäevi</div></div>
    </div>
    <div class="row" style="margin:16px 0 8px">
      <button class="btn small" data-act="add">＋ Lisa käsitsi</button>
      <span class="spacer"></span>
      <button class="btn small" data-act="csv-month" ${inMonth.length ? '' : 'disabled'}>Ekspordi CSV</button>
    </div>`;

  if (!days.length) {
    html += `<div class="card empty"><b>Selles kuus kirjeid pole</b>Vajuta Taimeri vaates Start või lisa kirje käsitsi.</div>`;
  } else {
    html += days.map(k => {
      const list = byDay.get(k).sort((a, b) => a.start - b.start);
      const dn = list.reduce((a, s) => a + netMs(s, now), 0), dp = list.reduce((a, s) => a + pauseMs(s, now), 0);
      return `<div class="card day"><div class="dayhead"><span class="d">${esc(fmtDay(k))}</span>
        <span class="t num"><b>${hm(dn)} h</b><span>paus ${hm(dp)}</span></span></div>
        ${list.map(sessionRow).join('')}</div>`;
    }).join('');
  }
  html += `<p class="muted" style="font-size:13px;text-align:center">Kirjet saab muuta või kustutada, kui sellele vajutad.</p>`;
  el.innerHTML = html;
}

function renderObjects() {
  const el = document.getElementById('view-objects');
  const objs = liveObjects();
  el.innerHTML = `
    <form class="card" id="form-add-object" autocomplete="off">
      <label class="field" style="margin-bottom:10px"><span>Uus objekt</span>
        <input type="text" name="name" placeholder="nt Tamme 12 vannituba" maxlength="80" required></label>
      <button class="btn primary" type="submit" style="width:100%">Lisa objekt</button>
    </form>
    <div class="label">Pooleliolevad objektid (${objs.length})</div>
    <div class="card">${objs.length ? objs.map(o => `<div class="objrow"><span class="n">${esc(o.name)}</span>
        <button class="btn ghost small" data-rename="${o.id}">Muuda</button>
        <button class="btn ghost small" data-archive="${o.id}" style="color:var(--danger)">Eemalda</button></div>`).join('')
      : '<div class="empty" style="padding:8px">Objekte pole veel lisatud.</div>'}</div>
    <div class="label">Andmed</div>
    <div class="card">
      <p class="muted" style="margin:0 0 12px;font-size:14px">Andmed on ainult selles telefonis. Tee aeg-ajalt varukoopia: kui brauseri andmed kustutada, lähevad tunnid kaotsi.</p>
      <div style="display:grid;gap:8px">
        <button class="btn" data-act="csv-all">Ekspordi kõik tunnid (CSV / Excel)</button>
        <button class="btn" data-act="backup">Salvesta varukoopia</button>
        <button class="btn" data-act="restore">Taasta varukoopiast</button>
      </div>
    </div>`;
}

function render() {
  document.getElementById('title').textContent = { timer: 'Taimer', summary: 'Koondvaade', objects: 'Objektid' }[tab];
  for (const t of ['timer', 'summary', 'objects']) document.getElementById('view-' + t).hidden = t !== tab;
  document.querySelectorAll('nav.tabs button').forEach(b => {
    if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (tab === 'timer') renderTimer();
  if (tab === 'summary') renderSummary();
  if (tab === 'objects') renderObjects();
  tick();
}

/* ---------- session edit dialog ---------- */
const dlg = document.getElementById('dlg-session');
const form = document.getElementById('form-session');
let editingId = null;

function openSessionDialog(id) {
  const s = id ? state.sessions.find(x => x.id === id) : null;
  if (s && !s.end) { toast('Käimasolevat tööd saab muuta pärast lõpetamist'); return; }
  editingId = id;
  const ids = [...new Set([...liveObjects().map(o => o.id), ...(s ? [s.objectId] : [])])];
  if (!ids.length) { toast('Lisa enne objekt'); return; }
  form.objectId.innerHTML = ids.map(i => `<option value="${i}">${esc(objName(i))}</option>`).join('');
  document.getElementById('dlg-session-title').textContent = s ? 'Muuda kirjet' : 'Lisa kirje käsitsi';
  document.getElementById('dlg-session-delete').hidden = !s;
  if (s) {
    form.objectId.value = s.objectId;
    form.date.value = dayKey(s.start);
    form.start.value = clockTime(s.start);
    form.end.value = clockTime(s.end);
    form.pause.value = Math.round(pauseMs(s) / 60000);
    form.note.value = s.note || '';
  } else {
    const today = dayKey(Date.now());
    form.objectId.value = state.selectedObjectId && ids.includes(state.selectedObjectId) ? state.selectedObjectId : ids[0];
    form.date.value = monthKey(Date.now()) === viewMonth ? today : viewMonth + '-01';
    form.start.value = '08:00'; form.end.value = '16:30'; form.pause.value = 30;
    form.note.value = '';
  }
  updateHint();
  dlg.showModal();
}
function formRange() {
  const start = new Date(form.date.value + 'T' + form.start.value).getTime();
  let end = new Date(form.date.value + 'T' + form.end.value).getTime();
  if (end <= start) end += 86400000; // ended after midnight
  return { start, end, pause: Math.max(0, Math.round(+form.pause.value || 0)) * 60000 };
}
function updateHint() {
  const { start, end, pause } = formRange();
  const hint = document.getElementById('dlg-session-hint');
  if (isNaN(start) || isNaN(end)) { hint.textContent = ''; return; }
  hint.textContent = pause >= end - start ? 'Paus ei saa olla pikem kui tööaeg.' : 'Töötunde: ' + hm(end - start - pause) + ' h';
}
form.addEventListener('input', updateHint);
form.addEventListener('submit', e => {
  e.preventDefault();
  const { start, end, pause } = formRange();
  if (isNaN(start) || isNaN(end)) return;
  if (pause >= end - start) { toast('Paus ei saa olla pikem kui tööaeg'); return; }
  let s = editingId && state.sessions.find(x => x.id === editingId);
  if (!s) { s = { id: uid(), pauses: [] }; state.sessions.push(s); }
  const keepPauses = s.start === start && Math.round(pauseMs(s) / 60000) * 60000 === pause;
  s.objectId = form.objectId.value; s.start = start; s.end = end;
  const note = form.note.value.trim();
  if (note) s.note = note; else delete s.note;
  // Only the pause total matters for the numbers; if it was edited, store it as one block.
  if (!keepPauses) s.pauses = pause ? [{ start, end: start + pause }] : [];
  save(); dlg.close(); toast('Salvestatud'); render();
});
document.getElementById('dlg-session-cancel').onclick = () => dlg.close();
document.getElementById('dlg-session-delete').onclick = () => {
  if (!confirm('Kustutad selle kirje?')) return;
  state.sessions = state.sessions.filter(x => x.id !== editingId);
  save(); dlg.close(); toast('Kustutatud'); render();
};

document.getElementById('form-stop').addEventListener('submit', e => {
  e.preventDefault();
  const note = e.target.elements.note.value.trim();
  document.getElementById('dlg-stop').close();
  finishWork(note);
});
document.getElementById('dlg-stop-cancel').onclick = () => document.getElementById('dlg-stop').close();

/* ---------- export / backup ---------- */
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const file = new File([blob], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: name }).catch(() => {});
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function csv(sessions, name) {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['Kuupäev', 'Objekt', 'Algus', 'Lõpp', 'Pausid (h:mm)', 'Töötunnid (h:mm)', 'Pausid (h)', 'Töötunnid (h)', 'Tehtud tööd']];
  sessions.filter(s => s.end).sort((a, b) => a.start - b.start).forEach(s => rows.push([
    dayKey(s.start), objName(s.objectId), clockTime(s.start), clockTime(s.end),
    hm(pauseMs(s)), hm(netMs(s)), decH(pauseMs(s)), decH(netMs(s)), s.note || '',
  ]));
  // BOM + semicolons so Estonian-locale Excel opens it with correct columns and letters.
  download(name, '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
}
document.getElementById('file-import').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.objects) || !Array.isArray(data.sessions)) throw new Error();
    if (!confirm('Taastan varukoopia (' + data.sessions.length + ' kirjet)? Praegused andmed asendatakse.')) return;
    state = data; save(); toast('Varukoopia taastatud'); render();
  } catch (err) { toast('See fail pole õige varukoopia'); }
});

/* ---------- event wiring ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.tab) { tab = d.tab; render(); window.scrollTo(0, 0); return; }
  if (d.goto) { tab = d.goto; render(); return; }
  if (d.pick) { state.selectedObjectId = d.pick; save(); render(); return; }
  if (d.edit) { openSessionDialog(d.edit); return; }
  if (d.month) {
    const [y, m] = viewMonth.split('-').map(Number);
    const dt = new Date(y, m - 1 + Number(d.month), 1);
    viewMonth = dt.getFullYear() + '-' + pad(dt.getMonth() + 1); render(); return;
  }
  if (d.rename) {
    const o = state.objects.find(o => o.id === d.rename);
    const n = prompt('Objekti nimi', o.name);
    if (n && n.trim()) { o.name = n.trim(); save(); render(); }
    return;
  }
  if (d.archive) {
    const o = state.objects.find(o => o.id === d.archive);
    const s = activeSession();
    if (s && s.objectId === o.id) { toast('Sellel objektil käib praegu töö'); return; }
    if (!confirm('Eemaldad objekti "' + o.name + '"? Selle tehtud tunnid jäävad koondvaatesse alles.')) return;
    if (state.sessions.some(s => s.objectId === o.id)) o.archived = true;
    else state.objects = state.objects.filter(x => x.id !== o.id);
    save(); render(); return;
  }
  switch (d.act) {
    case 'start': return startWork();
    case 'pause': return togglePause();
    case 'stop': return stopWork();
    case 'add': return openSessionDialog(null);
    case 'csv-month': return csv(state.sessions.filter(s => monthKey(s.start) === viewMonth && (!filterObject || s.objectId === filterObject)), 'tooaeg-' + viewMonth + '.csv');
    case 'csv-all': return state.sessions.length ? csv(state.sessions, 'tooaeg-koik.csv') : toast('Kirjeid veel pole');
    case 'backup': return download('tooaeg-varukoopia-' + dayKey(Date.now()) + '.json', JSON.stringify(state, null, 1), 'application/json');
    case 'restore': return document.getElementById('file-import').click();
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'filter-object') { filterObject = e.target.value; render(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'form-add-object') return;
  e.preventDefault();
  const name = e.target.elements.name.value.trim(); if (!name) return;
  const o = { id: uid(), name };
  state.objects.push(o);
  if (!state.selectedObjectId) state.selectedObjectId = o.id;
  save(); toast('Lisatud: ' + name); render();
  document.querySelector('#form-add-object input').focus();
});
// Another tab/window changed the data.
window.addEventListener('storage', e => { if (e.key === KEY) { state = load(); render(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
setInterval(tick, 1000);

render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
